name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      # Installe Gradle 9.7.1 : pas besoin du wrapper (gradlew) dans le dépôt.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.7.1

      - name: Compiler
        run: gradle build

      - uses: actions/upload-artifact@v4
        with:
          name: novaui
          path: build/libs/*.jar
